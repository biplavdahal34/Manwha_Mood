services:
  nginx:
    image: nginx:1.31.6
    container_name: nginx
    volumes:
      - ./:/var/www
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - my-network
    depends_on:
      - flask
  
  flask:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: flask
    volumes:
      - ./:/var/www
    networks:
      my-network:
        aliases:
          - flask-app

networks:
  my-network: 

